name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-build.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare the bundled runtime and test
        run: |
          npm run prepare:runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:STORYDESK_BUNDLED_PYTHON = (Resolve-Path -LiteralPath '.build-runtime/python/python.exe').Path
          npm test

      - name: Build the Windows x64 installer
        run: npm run installer -- --publish never

      - name: Audit the bundle and record its checksum
        id: audit
        run: |
          node scripts/audit-public.mjs release-public
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "installer=release-public/StoryDesk-${version}-win-x64.exe" >> $env:GITHUB_OUTPUT
          @(
            '### Windows x64 unsigned installer'
            ''
            "Source commit: $env:GITHUB_SHA"
            ''
            (Get-Content -LiteralPath 'release-public/SHA256SUMS.txt')
          ) >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storydesk-windows-x64-unsigned
          path: ${{ steps.audit.outputs.installer }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload the unsigned checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storydesk-windows-x64-unsigned-sha256
          path: release-public/SHA256SUMS.txt
          if-no-files-found: error
